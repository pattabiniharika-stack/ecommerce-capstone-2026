<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>E-Commerce Store</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">

      🛒 E-Commerce Store

    </div>

    <nav>

      <a href="#home">Home</a>
      <a href="#products-section">Products</a>
      <a href="#cart">Cart</a>

    </nav>

  </header>

  <!-- HERO -->

  <section class="hero" id="home">

    <h1>Modern Shopping Experience</h1>

    <p>
      Browse amazing products with responsive UI
    </p>

  </section>

  <!-- CONTROLS -->

  <section class="controls">

    <input
      type="text"
      id="searchInput"
      placeholder="Search products..."
    >

    <select id="categoryFilter">

      <option value="all">
        All Categories
      </option>

      <option value="Electronics">
        Electronics
      </option>

      <option value="Accessories">
        Accessories
      </option>

    </select>

  </section>

  <!-- PRODUCTS -->

  <main
    class="product-grid"
    id="products-section"
  ></main>

  <!-- CART -->

  <section
    class="cart-section"
    id="cart"
  >

    <h2>🛍 Shopping Cart</h2>

    <ul id="cartItems"></ul>

    <h3 id="totalPrice">
      Total: ₹0
    </h3>

  </section>

  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 E-Commerce Store
    </p>

  </footer>

  <script src="products.js"></script>

  <script src="script.js"></script>

</body>

</html>
