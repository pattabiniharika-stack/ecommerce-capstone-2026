<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Modern E-Commerce Store</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HEADER -->

<header>

  <div class="logo">

    🛒 ShopEase

  </div>

  <nav>

    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart</a>

  </nav>

</header>

<!-- HERO -->

<section class="hero" id="home">

  <h1>Modern Shopping Experience</h1>

  <p>
    Buy premium products online
  </p>

</section>

<!-- SEARCH -->

<section class="controls">

  <input
    type="text"
    id="searchInput"
    placeholder="Search products..."
  >

  <select id="categoryFilter">

    <option value="all">
      All Categories
    </option>

    <option value="Electronics">
      Electronics
    </option>

    <option value="Accessories">
      Accessories
    </option>

  </select>

</section>

<!-- PRODUCTS -->

<main
  class="product-grid"
  id="products"
></main>

<!-- CART -->

<section
  class="cart-section"
  id="cart"
>

  <h2>🛍 Shopping Cart</h2>

  <div id="cartItems"></div>

  <h3 id="totalPrice">
    Total: ₹0
  </h3>

  <!-- PAYMENT -->

  <div class="payment-section">

    <h3>Payment Method</h3>

    <select id="paymentMethod">

      <option>
        Credit Card
      </option>

      <option>
        Debit Card
      </option>

      <option>
        UPI
      </option>

      <option>
        Cash on Delivery
      </option>

    </select>

    <button id="checkoutBtn">

      Proceed to Checkout

    </button>

  </div>

</section>

<script src="products.js"></script>

<script src="script.js"></script>

</body>

</html>
